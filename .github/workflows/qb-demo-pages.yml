name: Deploy Query Builder Demo to GitHub Pages

on:
  push:
    branches:
      - claude/nickel-query-builder-du1gi0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest Metabase release JAR
        run: |
          set -e
          echo "Fetching latest Metabase release..."
          RELEASE_JSON=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/metabase/metabase/releases/latest")
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "Release tag : $TAG"
          echo "Available assets:"
          echo "$RELEASE_JSON" | jq -r '.assets[] | "\(.name) (\(.size) bytes)"'
          # Try metabase.jar first, then any .jar file
          JAR_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "metabase.jar") | .browser_download_url')
          if [ -z "$JAR_URL" ]; then
            JAR_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -1)
          fi
          echo "Downloading : $JAR_URL"
          curl -L --progress-bar -o metabase.jar "$JAR_URL"
          ls -lh metabase.jar

      - name: Extract frontend from JAR
        run: |
          mkdir -p resources/frontend_client
          unzip -q metabase.jar "resources/frontend_client/*" -d .
          echo "Files extracted:"
          ls resources/frontend_client/ | head -20
          # Verify index.html exists with Mustache vars
          grep -c '{{{' resources/frontend_client/index.html && echo "✓ Mustache vars found in index.html"

      - name: Post-process for GitHub Pages
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}"
          echo "Patching build for: ${PAGES_URL}"
          node qb-demo/post-build.js "${PAGES_URL}"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./resources/frontend_client
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy QB demo [skip ci]"
