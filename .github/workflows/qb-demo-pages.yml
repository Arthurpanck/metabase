name: Deploy Query Builder Demo to GitHub Pages

on:
  push:
    branches:
      - claude/nickel-query-builder-du1gi0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (required for ClojureScript compilation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/download/1.12.3.2/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Maven dependencies (for ClojureScript build)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-cljs-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            m2-cljs-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Prefetch Clojure dependencies
        run: clojure -P -A:cljs

      - name: Build ClojureScript (metabase-lib + pivot + types)
        run: bun run build-release:cljs
        env:
          NODE_ENV: production

      - name: Build frontend JS
        run: bun run build-release:js
        env:
          WEBPACK_BUNDLE: production
          NODE_ENV: production

      - name: Post-process for GitHub Pages
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}"
          echo "Patching build for: ${PAGES_URL}"
          node qb-demo/post-build.js "${PAGES_URL}"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./resources/frontend_client
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy QB demo [skip ci]"
